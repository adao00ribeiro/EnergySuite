global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'etrm-service'
    static_configs:
      - targets: ['etrm-service:8080']

  - job_name: 'risk-service'
    static_configs:
      - targets: ['risk-service:8001']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
