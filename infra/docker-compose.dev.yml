#
# =============================================================================
#  EnergySuite - Docker Compose de DESENVOLVIMENTO
# =============================================================================
#  Objetivo: rodar SOMENTE a infraestrutura (Postgres, Kafka, Keycloak, MinIO,
#  MLflow, Airflow) + o risk-service em Docker.
#
#  O ETRM Service (.NET) e os Micro-frontends (Angular) rodam LOCALMENTE com
#  hot reload, apontando para os containers abaixo. Nenhum rebuild na imagem é
#  necessário durante o desenvolvimento.
#
#  Uso:
#    docker compose -f docker-compose.dev.yml up -d         # subir infra
#    docker compose -f docker-compose.dev.yml down          # parar (mantém volumes)
#    docker compose -f docker-compose.dev.yml down -v       # parar + apagar volumes
#    docker compose -f docker-compose.dev.yml logs -f risk-service
#
#  ─────────────────────────────────────────────────────────────────────────────
#  Como rodar a aplicação localmente (Terminais separados):
#
#  0) SUBIR a infraestrutura primeiro (este arquivo):
#     docker compose -f infra/docker-compose.dev.yml up -d --build
#
#  1) ETRM Service (.NET 8) — porta 8080 (o frontend espera localhost:8080):
#     cd backend/etrm-service/EtrmService.API
#     dotnet watch run
#
#  2/3) FRONTENDS — TUDO de uma vez via script bash (não baixa nada):
#     na raiz de frontend/, usando o ng local de cada projeto:
#     cd frontend && ./start.sh
#     # Portas: app-shell 4200, portfolio 4201, operations 4202,
#     #         pricing 4203, hydrology 4204. (Ctrl+C para parar todos.)
#
#     (Opcional, individualmente:)
#     cd frontend/app-shell && ng serve --port 4200
#     cd frontend/mf-portfolio   && ng serve --port 4201
#     cd frontend/mf-operations  && ng serve --port 4202
#     cd frontend/mf-pricing     && ng serve --port 4203
#     cd frontend/mf-hydrology   && ng serve --port 4204
#
#  ─────────────────────────────────────────────────────────────────────────────
#  Endpoints locais usados pela aplicação (host → container):
#    Postgres .............. localhost:5432
#    Kafka ................. localhost:9092   (appsettings.Development.json já usa)
#    Keycloak (frontend) ... http://localhost:8083  (hardcoded em keycloak-init.factory.ts)
#    Keycloak (etrm) ....... http://localhost:8083  (editar appsettings.Development.json)
#    MinIO API ............ localhost:9000
#    MinIO Console ........ localhost:9001
#    MLflow ................ http://localhost:5000
#    Airflow ............... http://localhost:8082
#    Risk Service .......... http://localhost:8000
#    Prometheus ............ localhost:9090
#    Grafana ............... http://localhost:3000
#    Tempo ................. localhost:4317 (OTLP) / 3200 / 4318
#
#  ⚠️ OBSERVAÇÃO (Keycloak no ETRM): o compose expõe o Keycloak na porta 8083
#  (host) ↔ 8080 (container). O appsettings.Development.json do etrm-service
#  aponta `Keycloak:AdminBaseUrl` para http://localhost:8080 — troque para
#  http://localhost:8083 caso o fluxo de admin do Keycloak seja necessário.
# =============================================================================

services:
  # ==========================================
  # DATABASES
  # ==========================================
  postgres:
    image: postgres:15
    container_name: energysuite-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: etrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - energysuite-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d etrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # MESSAGING (KAFKA WITH KRAFT)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: energysuite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - energysuite-dev-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: energysuite-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
    depends_on:
      - kafka
    networks:
      - energysuite-dev-net

  # ==========================================
  # IDENTITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: energysuite-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/etrm_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: rootpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energysuite-dev-net

  # ==========================================
  # OBSERVABILITY (PROMETHEUS, TEMPO, GRAFANA)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: energysuite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - energysuite-dev-net

  tempo:
    image: grafana/tempo:latest
    container_name: energysuite-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - minio
    networks:
      - energysuite-dev-net

  grafana:
    image: grafana/grafana:latest
    container_name: energysuite-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - tempo
    networks:
      - energysuite-dev-net

  # ==========================================
  # MICROSERVICES
  # ==========================================
  # NOTE: O ETRM Service (.NET) roda LOCALMENTE via `dotnet watch run` e se
  # conecta à infra via appsettings.Development.json + fallback em
  # NativeInjectorConfig.cs (Host=localhost). Nenhum override de env é
  # necessário para o hot reload local funcionar.

  risk-service:
    build:
      context: ../backend/risk-service
      dockerfile: Dockerfile
    container_name: energysuite-risk-service
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - DATABASE_URL=postgresql+asyncpg://root:rootpassword@postgres:5432/risk_db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=datalake
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    volumes:
      # Monta o código-fonte com hot reload (uvicorn --reload)
      # Dependências continuam instaladas na imagem (node_modules/venv equivalente)
      - ../backend/risk-service/src:/app/src
    command: >
      uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - kafka
      - minio
      - mlflow
      - tempo
    networks:
      - energysuite-dev-net

  # ==========================================
  # DATA LAKE & MLOPS
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: energysuite-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - energysuite-dev-net

  minio-create-buckets:
    image: minio/mc:latest
    container_name: energysuite-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/datalake --ignore-existing;
      /usr/bin/mc mb myminio/mlflow --ignore-existing;
      "
    networks:
      - energysuite-dev-net

  mlflow:
    image: python:3.11-slim
    container_name: energysuite-mlflow
    ports:
      - "5000:5000"
    command: bash -c "pip install 'numpy<2.0.0' mlflow boto3 psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --cors-allowed-origins '*' --backend-store-uri postgresql://root:rootpassword@postgres:5432/mlflow_db --default-artifact-root s3://mlflow/"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - minio
      - postgres
    networks:
      - energysuite-dev-net

  airflow:
    build:
      context: ../backend/mlops
    container_name: energysuite-airflow
    ports:
      - "8082:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://root:rootpassword@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MINIO_ENDPOINT=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ../backend/mlops/dags:/opt/airflow/dags
    depends_on:
      - minio
      - mlflow
      - postgres
    networks:
      - energysuite-dev-net
    command: bash -c "airflow scheduler & airflow webserver"

volumes:
  postgres_data:

networks:
  energysuite-dev-net:
    driver: bridge
