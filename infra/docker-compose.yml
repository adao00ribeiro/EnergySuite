
services:
  # ==========================================
  # DATABASES
  # ==========================================
  postgres:
    image: postgres:15
    container_name: energysuite-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: etrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - energysuite-net

  # ==========================================
  # MESSAGING (KAFKA WITH KRAFT)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: energysuite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    # volumes:
    #   - kafka_data:/tmp/kraft-combined-logs
    networks:
      - energysuite-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: energysuite-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
    depends_on:
      - kafka
    networks:
      - energysuite-net

  # ==========================================
  # IDENTITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: energysuite-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/etrm_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: rootpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      - postgres
    networks:
      - energysuite-net

  # ==========================================
  # OBSERVABILITY (PROMETHEUS, JAEGER, GRAFANA)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: energysuite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - energysuite-net

  tempo:
    image: grafana/tempo:latest
    container_name: energysuite-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - minio
    networks:
      - energysuite-net

  grafana:
    image: grafana/grafana:latest
    container_name: energysuite-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - tempo
    networks:
      - energysuite-net

  # ==========================================
  # MICROSERVICES (EnergySuite)
  # ==========================================
  etrm-service:
    build:
      context: ../backend/etrm-service
      dockerfile: Dockerfile
    container_name: energysuite-etrm-service
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=etrm_db;Username=root;Password=rootpassword
      - Kafka__BootstrapServers=kafka:19092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      - postgres
      - kafka
      - tempo
    networks:
      - energysuite-net

  risk-service:
    build:
      context: ../backend/risk-service
      dockerfile: Dockerfile
    container_name: energysuite-risk-service
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - DATABASE_URL=postgresql+asyncpg://root:rootpassword@postgres:5432/risk_db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=datalake
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      - kafka
      - minio
      - mlflow
      - tempo
    networks:
      - energysuite-net

  app-shell:
    build:
      context: ../frontend/app-shell
      dockerfile: Dockerfile
    container_name: energysuite-app-shell
    ports:
      - "4200:80"
    networks:
      - energysuite-net

  mf-portfolio:
    build:
      context: ../frontend/mf-portfolio
      dockerfile: Dockerfile
    container_name: energysuite-mf-portfolio
    ports:
      - "4201:80"
    networks:
      - energysuite-net

  mf-operations:
    build:
      context: ../frontend/mf-operations
      dockerfile: Dockerfile
    container_name: energysuite-mf-operations
    ports:
      - "4202:80"
    networks:
      - energysuite-net

  mf-pricing:
    build:
      context: ../frontend/mf-pricing
      dockerfile: Dockerfile
    container_name: energysuite-mf-pricing
    ports:
      - "4203:80"
    networks:
      - energysuite-net

  mf-hydrology:
    build:
      context: ../frontend/mf-hydrology
      dockerfile: Dockerfile
    container_name: energysuite-mf-hydrology
    ports:
      - "4204:80"
    networks:
      - energysuite-net

  # ==========================================
  # DATA LAKE & MLOPS (Caminho 2)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: energysuite-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - energysuite-net

  minio-create-buckets:
    image: minio/mc:latest
    container_name: energysuite-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/datalake --ignore-existing;
      /usr/bin/mc mb myminio/mlflow --ignore-existing;
      "
    networks:
      - energysuite-net

  mlflow:
    image: python:3.11-slim
    container_name: energysuite-mlflow
    ports:
      - "5000:5000"
    command: bash -c "pip install 'numpy<2.0.0' mlflow boto3 psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --cors-allowed-origins '*' --backend-store-uri postgresql://root:rootpassword@postgres:5432/mlflow_db --default-artifact-root s3://mlflow/"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - minio
      - postgres
    networks:
      - energysuite-net

  airflow:
    build:
      context: ../backend/mlops
    container_name: energysuite-airflow
    ports:
      - "8082:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://root:rootpassword@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MINIO_ENDPOINT=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ../backend/mlops/dags:/opt/airflow/dags
    depends_on:
      - minio
      - mlflow
      - postgres
    networks:
      - energysuite-net
    command: bash -c "airflow scheduler & airflow webserver"

volumes:
  postgres_data:
  kafka_data:

networks:
  energysuite-net:
    driver: bridge
