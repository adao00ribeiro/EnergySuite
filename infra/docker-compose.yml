version: '3.8'

services:
  # ==========================================
  # DATABASES
  # ==========================================
  postgres:
    image: postgres:15
    container_name: energysuite-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: etrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - energysuite-net

  # ==========================================
  # MESSAGING (KAFKA WITH KRAFT)
  # ==========================================
  kafka:
    image: bitnami/kafka:3.5.0
    container_name: energysuite-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - energysuite-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: energysuite-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - energysuite-net

  # ==========================================
  # IDENTITY (KEYCLOAK)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: energysuite-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/etrm_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: rootpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - energysuite-net

  # ==========================================
  # OBSERVABILITY (PROMETHEUS, JAEGER, GRAFANA)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: energysuite-prometheus
    ports:
      - "9090:9090"
    networks:
      - energysuite-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: energysuite-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - energysuite-net

  grafana:
    image: grafana/grafana:latest
    container_name: energysuite-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - jaeger
    networks:
      - energysuite-net

volumes:
  postgres_data:
  kafka_data:

networks:
  energysuite-net:
    driver: bridge
