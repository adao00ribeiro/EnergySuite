apiVersion: v1
kind: ConfigMap
metadata:
  name: energysuite-env-config
  namespace: energysuite
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  Kafka__BootstrapServers: "kafka:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
  KEYCLOAK_AUTHORITY: "http://keycloak:8080/realms/EnergySuite"
  MINIO_ENDPOINT: "http://minio:9000"
  PROMETHEUS_METRICS_ENABLED: "true"
  PUBLIC_API_URL: "http://energysuite.local"

  # ── Frontend Runtime (window.__env) ──
  KEYCLOAK_URL: "http://energysuite.local"
  KEYCLOAK_REALM: "EnergySuite"
  KEYCLOAK_CLIENT_ID: "energysuite-frontend"
  API_GATEWAY_URL: "http://energysuite.local"
  ENVIRONMENT: "development"

  # Arquivo injetado dinamicamente nos MFEs (Nginx) sem recompilar a imagem
  env.js: |
    (function (window) {
      window.__env = window.__env || {};
      window.__env.KEYCLOAK_URL = window.__env.KEYCLOAK_URL || 'http://energysuite.local';
      window.__env.KEYCLOAK_REALM = window.__env.KEYCLOAK_REALM || 'EnergySuite';
      window.__env.KEYCLOAK_CLIENT_ID = window.__env.KEYCLOAK_CLIENT_ID || 'energysuite-frontend';
      window.__env.API_GATEWAY_URL = window.__env.API_GATEWAY_URL || 'http://energysuite.local';
      window.__env.ENVIRONMENT = window.__env.ENVIRONMENT || 'development';
    })(this);
