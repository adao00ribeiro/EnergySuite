apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: energysuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:latest
          args: ["-config.file=/etc/tempo.yaml"]
          ports:
            - containerPort: 3200 # HTTP API
            - containerPort: 4317 # OTLP gRPC
            - containerPort: 4318 # OTLP HTTP
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: energysuite
spec:
  ports:
    - name: http-query
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: tempo
