apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: energysuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:22.0.1
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/etrm_db"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: energysuite-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: energysuite-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: energysuite
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: keycloak
