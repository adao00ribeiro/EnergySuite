apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energysuite-base-ingress
  namespace: energysuite
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "etrm-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # ── Micro-frontends ──
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  number: 80
          - path: /mf-hydrology
            pathType: Prefix
            backend:
              service:
                name: mf-hydrology
                port:
                  number: 80
          - path: /mf-operations
            pathType: Prefix
            backend:
              service:
                name: mf-operations
                port:
                  number: 80
          - path: /mf-portfolio
            pathType: Prefix
            backend:
              service:
                name: mf-portfolio
                port:
                  number: 80
          - path: /mf-pricing
            pathType: Prefix
            backend:
              service:
                name: mf-pricing
                port:
                  number: 80

          # ── Headlamp Dashboard ──
          - path: /headlamp
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

          # ── Identity & Access Management (Keycloak) ──
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

          # ── Python Risk Service ──
          - path: /api/v1/risk
            pathType: Prefix
            backend:
              service:
                name: risk-service
                port:
                  number: 8000

          # ── ETRM Core Backend Services & APIs ──
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080

          # ── SignalR Hubs ──
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
