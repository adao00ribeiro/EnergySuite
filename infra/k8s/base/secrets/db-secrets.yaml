apiVersion: v1
kind: Secret
metadata:
  name: energysuite-secrets
  namespace: energysuite
type: Opaque
stringData:
  POSTGRES_USER: "root"
  POSTGRES_PASSWORD: "rootpassword"
  POSTGRES_DB: "etrm_db"
  ETRM_DB_CONNECTION: "Host=postgres;Port=5432;Database=etrm_db;Username=root;Password=rootpassword"
  RISK_DB_CONNECTION: "postgresql+asyncpg://root:rootpassword@postgres:5432/etrm_db"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadminpassword"
