apiVersion: apps/v1
kind: Deployment
metadata:
  name: mf-portfolio
  namespace: energysuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mf-portfolio
  template:
    metadata:
      labels:
        app: mf-portfolio
    spec:
      containers:
        - name: mf-portfolio
          image: energysuite/mf-portfolio:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mf-portfolio
  namespace: energysuite
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32001
  selector:
    app: mf-portfolio
