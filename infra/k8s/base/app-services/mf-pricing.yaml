apiVersion: apps/v1
kind: Deployment
metadata:
  name: mf-pricing
  namespace: energysuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mf-pricing
  template:
    metadata:
      labels:
        app: mf-pricing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/"
    spec:
      volumes:
        - name: runtime-env
          configMap:
            name: energysuite-env-config
            items:
              - key: env.js
                path: env.js
      containers:
        - name: mf-pricing
          image: energysuite/mf-pricing:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: runtime-env
              mountPath: /usr/share/nginx/html/assets/env.js
              subPath: env.js
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mf-pricing
  namespace: energysuite
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: mf-pricing
