apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
  namespace: energysuite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
    spec:
      volumes:
        - name: federation-manifest
          configMap:
            name: federation-manifest-cm
      containers:
        - name: app-shell
          image: energysuite/app-shell:latest
          volumeMounts:
            - name: federation-manifest
              mountPath: /usr/share/nginx/html/federation.manifest.json
              subPath: federation.manifest.json
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
  namespace: energysuite
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
  selector:
    app: app-shell
