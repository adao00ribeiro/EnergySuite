apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
  namespace: energysuite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/"
    spec:
      volumes:
        - name: federation-manifest
          configMap:
            name: federation-manifest-cm
        - name: runtime-env
          configMap:
            name: energysuite-env-config
            items:
              - key: env.js
                path: env.js
      containers:
        - name: app-shell
          image: energysuite/app-shell:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: federation-manifest
              mountPath: /usr/share/nginx/html/federation.manifest.json
              subPath: federation.manifest.json
            - name: runtime-env
              mountPath: /usr/share/nginx/html/assets/env.js
              subPath: env.js
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
  namespace: energysuite
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: app-shell
