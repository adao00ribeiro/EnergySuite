apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: energysuite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: energysuite/risk-service:latest
          ports:
            - containerPort: 8000
            - containerPort: 8001 # Prometheus metrics
          envFrom:
            - configMapRef:
                name: energysuite-env-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://root:rootpassword@postgres:5432/etrm_db"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: energysuite
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 8001
      targetPort: 8001
  selector:
    app: risk-service
