apiVersion: apps/v1
kind: Deployment
metadata:
  name: etrm-service
  namespace: energysuite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etrm-service
  template:
    metadata:
      labels:
        app: etrm-service
    spec:
      containers:
        - name: etrm-service
          image: energysuite/etrm-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: energysuite-env-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=etrm_db;Username=root;Password=rootpassword"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: etrm-service
  namespace: energysuite
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: etrm-service
