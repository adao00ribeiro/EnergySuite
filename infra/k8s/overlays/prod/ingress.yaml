apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: energysuite-ingress
  namespace: energysuite
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "etrm-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: energysuite.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-shell
                port:
                  number: 80

          # ── Headlamp Dashboard ──
          - path: /headlamp
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

          # ── API routes → etrm-service ──
          - path: /api/v1/contracts
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/operations
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/portfolios
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/companies
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/settings
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/prospect
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/pluvia
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/tickets
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/strategies
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/finance
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/ccee-integration
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /api/v1/pricing
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080

          # ── SignalR hubs → etrm-service ──
          - path: /hubs/risk
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /hubs/alerts
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
          - path: /hubs/prospect
            pathType: Prefix
            backend:
              service:
                name: etrm-service
                port:
                  number: 8080
