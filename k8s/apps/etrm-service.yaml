apiVersion: apps/v1
kind: Deployment
metadata:
  name: etrm-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: etrm-service
  template:
    metadata:
      labels:
        app: etrm-service
    spec:
      containers:
      - name: etrm-service
        image: energysuite/etrm-service:latest
        imagePullPolicy: Never
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Port=5432;Database=etrm_db;Username=root;Password=rootpassword"
        - name: Kafka__BootstrapServers
          value: "kafka:19092"
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: etrm-service
spec:
  ports:
  - port: 5000
    targetPort: 8080
    nodePort: 30005
  selector:
    app: etrm-service
  type: NodePort
