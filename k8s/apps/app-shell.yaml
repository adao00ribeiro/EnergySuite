apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-shell
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-shell
  template:
    metadata:
      labels:
        app: app-shell
    spec:
      containers:
      - name: app-shell
        image: energysuite/app-shell:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-shell
spec:
  ports:
  - port: 4200
    targetPort: 80
    nodePort: 30042
  selector:
    app: app-shell
  type: NodePort
