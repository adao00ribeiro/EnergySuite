<div class="dashboard-layout animate-fade-in">
  <header class="dashboard-header">
    <div>
      <h1 class="page-title text-gradient">Imeris - Risco e Precificação</h1>
      <p class="page-subtitle">Posição consolidada e cenários projetados em {{ currentDate | date:'longDate' }}</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="onNewSimulation()">Nova Simulação</button>
    </div>
  </header>

  <main class="dashboard-content">
    <app-risk-metrics [metrics]="riskMetrics"></app-risk-metrics>
    
    <div class="charts-grid">
      <app-forward-curve-chart></app-forward-curve-chart>
    </div>
  </main>
</div>
