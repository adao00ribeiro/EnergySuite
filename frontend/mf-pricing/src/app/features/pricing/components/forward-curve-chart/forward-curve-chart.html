<div class="glass-panel chart-container animate-fade-in">
  <div class="chart-header">
    <h3 class="chart-title">Curva Forward de Preços (PLD)</h3>
  </div>
  <div class="chart-wrapper">
    <div echarts [options]="chartOptions" class="echarts-instance"></div>

    <div *ngIf="isEmpty()" class="chart-state empty-state">
      <mat-icon>show_chart</mat-icon>
      <p>Nenhum dado de curva forward disponível no momento.</p>
    </div>

    <div *ngIf="hasError()" class="chart-state error-state">
      <mat-icon>warning_amber</mat-icon>
      <p>Não foi possível carregar a curva forward. Tente novamente mais tarde.</p>
    </div>
  </div>
</div>
