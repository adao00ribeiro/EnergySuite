<div class="prospect-container">
  <div class="header">
    <h1>Estudos Prospectivos</h1>
    <button mat-flat-button color="primary">
      <mat-icon>add</mat-icon> Novo Estudo
    </button>
  </div>

  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="studies()">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> 
          <strong>{{element.name}}</strong>
          <div class="subtitle">{{element.description}}</div>
        </td>
      </ng-container>

      <!-- Model Column -->
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef> Modelo </th>
        <td mat-cell *matCellDef="let element"> {{element.model}} </td>
      </ng-container>

      <!-- Start Date Column -->
      <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef> Data Base </th>
        <td mat-cell *matCellDef="let element"> {{element.startDate | date:'MM/yyyy'}} </td>
      </ng-container>

      <!-- Horizon Column -->
      <ng-container matColumnDef="horizon">
        <th mat-header-cell *matHeaderCellDef> Horizonte </th>
        <td mat-cell *matCellDef="let element"> {{element.horizonMonths}} meses </td>
      </ng-container>

      <!-- State Column -->
      <ng-container matColumnDef="state">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element">
          <mat-chip-set>
            <mat-chip [color]="getStateColor(element.state)" highlighted>{{element.state}}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" [routerLink]="['/prospect', element.id]">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent">
            <mat-icon>play_arrow</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
