<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="logo-container">
      <h2>Norus ETRM</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <div matListItemTitle>Executive Risk & ML</div>
      </a>
      <a mat-list-item routerLink="/contracts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>description</mat-icon>
        <div matListItemTitle>Contracts</div>
      </a>
      <a mat-list-item routerLink="/risk/counterparty" routerLinkActive="active-link">
        <mat-icon matListItemIcon>business</mat-icon>
        <div matListItemTitle>Credit Risk (Portfolio)</div>
      </a>
      <a mat-list-item routerLink="/portfolio" routerLinkActive="active-link">
        <mat-icon matListItemIcon>pie_chart</mat-icon>
        <div matListItemTitle>Portfolio (Menza)</div>
      </a>
      <a mat-list-item routerLink="/operations" routerLinkActive="active-link">
        <mat-icon matListItemIcon>account_balance</mat-icon>
        <div matListItemTitle>Operations (BackOps)</div>
      </a>
      <a mat-list-item routerLink="/analytics/pricing" routerLinkActive="active-link">
        <mat-icon matListItemIcon>timeline</mat-icon>
        <div matListItemTitle>Pricing (Prospec)</div>
      </a>
      <a mat-list-item routerLink="/analytics/hydrology" routerLinkActive="active-link">
        <mat-icon matListItemIcon>water_drop</mat-icon>
        <div matListItemTitle>Hydrology (Pluvia)</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>EnergySuite Workspace</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="themeService.toggleTheme()">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>
    
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
