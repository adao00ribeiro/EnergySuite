<mat-sidenav-container class="shell-container">
  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="shell-sidebar" [class.collapsed]="isCollapsed">
    
    <!-- Top Header -->
    <div class="sidebar-header">
      <div class="logo-area" (click)="goHome()">
        <div class="logo-box">
          <mat-icon>bolt</mat-icon>
        </div>
        <div class="logo-text" *ngIf="!isCollapsed">
          <h2>Energy Portfolio</h2>
        </div>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()" [matTooltip]="isCollapsed ? 'Expandir Menu' : 'Recolher Menu'">
        <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>
    
    <!-- Main Navigation -->
    <div class="sidebar-scroll-area">
      <nav class="sidebar-nav">
        
        <!-- Main Groups -->
        <div class="nav-section">
          <div class="nav-section-title" *ngIf="!isCollapsed">Geral</div>
          
          <div class="nav-group" *ngFor="let group of navGroups">
            
            <!-- Group Header (Clickable) -->
            <div class="group-header" 
                 [class.active]="isGroupActive(group)" 
                 [class.has-children]="group.children && group.children.length > 0"
                 (click)="handleGroupClick(group)"
                 [matTooltip]="isCollapsed ? group.label : ''"
                 matTooltipPosition="right">
                 
              <div class="group-header-content">
                <mat-icon class="group-icon">{{ group.icon }}</mat-icon>
                <span class="group-label" *ngIf="!isCollapsed">{{ group.label }}</span>
              </div>
              
              <div class="group-actions" *ngIf="!isCollapsed">
                <span class="badge" *ngIf="group.badge">{{ group.badge }}</span>
                <mat-icon class="expand-icon" *ngIf="group.children && group.children.length > 0">
                  {{ expandedGroups[group.label] ? 'expand_more' : 'chevron_right' }}
                </mat-icon>
              </div>
            </div>

            <!-- Group Children (Submenu) -->
            <div class="submenu" *ngIf="group.children && expandedGroups[group.label] && !isCollapsed">
              <a *ngFor="let child of group.children"
                 [routerLink]="child.path"
                 routerLinkActive="active"
                 [routerLinkActiveOptions]="{exact: true}"
                 class="submenu-item">
                <span class="submenu-dot"></span>
                <span class="submenu-label">{{ child.label }}</span>
              </a>
            </div>
            
          </div>
        </div>
        
      </nav>
    </div>
    
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="shell-content">
    <div class="topbar">
      <div class="breadcrumbs">
        <!-- Optional Breadcrumbs -->
      </div>
      <div class="topbar-actions">
        <!-- Global Actions -->
        <button class="icon-btn" matTooltip="Alertas">
          <mat-icon>notifications_none</mat-icon>
        </button>
        <button class="icon-btn" matTooltip="Configurações">
          <mat-icon>settings</mat-icon>
        </button>
        
        <button class="theme-toggle-btn" (click)="toggleTheme()" [matTooltip]="isDarkTheme ? 'Mudar para Tema Claro' : 'Mudar para Tema Escuro'">
          <mat-icon>{{ isDarkTheme ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <div class="user-profile" [matMenuTriggerFor]="userMenu">
          <div class="avatar">{{ userInitials }}</div>
        </div>
        
        <mat-menu #userMenu="matMenu">
          <div class="user-details">
            <span class="u-name">{{ userProfile?.firstName || 'Usuário' }}</span>
            <span class="u-email">{{ userProfile?.email }}</span>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>Meu Perfil</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>
    </div>
    
    <!-- Micro-frontends get injected here -->
    <main class="mf-wrapper">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
