<div class="header">
  <button mat-icon-button routerLink="/contracts" color="primary">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h1>Novo Contrato</h1>
</div>

<div class="form-container mat-elevation-z4">
  <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraparte</mat-label>
        <input matInput formControlName="counterpartyName" placeholder="Ex: CCEE, Usina X">
        <mat-error *ngIf="contractForm.controls.counterpartyName.hasError('required')">Campo obrigatório</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row two-cols">
      <mat-form-field appearance="outline">
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let type of contractTypes" [value]="type.value">
            {{type.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Submercado</mat-label>
        <mat-select formControlName="submarket">
          <mat-option *ngFor="let sub of submarkets" [value]="sub.value">
            {{sub.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row two-cols">
      <mat-form-field appearance="outline">
        <mat-label>Volume (MWmed)</mat-label>
        <input matInput type="number" formControlName="volumeMwMed" min="0.1" step="0.1">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Preço (R$/MWh)</mat-label>
        <input matInput type="number" formControlName="price" min="0.1" step="0.1">
      </mat-form-field>
    </div>

    <div class="form-row two-cols">
      <mat-form-field appearance="outline">
        <mat-label>Data de Início</mat-label>
        <input matInput [matDatepicker]="pickerStart" formControlName="startDate">
        <mat-datepicker-toggle matIconSuffix [for]="pickerStart"></mat-datepicker-toggle>
        <mat-datepicker #pickerStart></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de Término</mat-label>
        <input matInput [matDatepicker]="pickerEnd" formControlName="endDate">
        <mat-datepicker-toggle matIconSuffix [for]="pickerEnd"></mat-datepicker-toggle>
        <mat-datepicker #pickerEnd></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <button mat-button type="button" routerLink="/contracts">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="contractForm.invalid || contractService.isLoading()">
        <mat-icon>save</mat-icon> Salvar Contrato
      </button>
    </div>
  </form>
</div>
