<div class="risk-dashboard">
  <div class="header">
    <mat-icon>business</mat-icon>
    <h1>Risco de Crédito Corporativo (Portfólio)</h1>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Agregando contratos do portfólio...</p>
  </div>

  <div class="content" *ngIf="!isLoading">
    <mat-card class="chart-card mat-elevation-z4">
      <mat-card-header>
        <mat-card-title>Exposição Financeira e MtM por Contraparte</mat-card-title>
        <mat-card-subtitle>Análise agregada de todos os contratos ativos no ETRM para a sua organização.</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div 
          *ngIf="portfolioData.length > 0; else noData"
          echarts 
          [options]="chartOption" 
          class="echarts-container">
        </div>
        <ng-template #noData>
          <div class="no-data-msg">
            <mat-icon>info</mat-icon>
            <p>Nenhum contrato encontrado para o seu portfólio.</p>
          </div>
        </ng-template>
      </mat-card-content>
    </mat-card>
  </div>
</div>
