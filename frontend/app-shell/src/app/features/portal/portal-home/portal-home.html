<div class="launcher-container">
  <!-- Sidebar -->
  <aside class="launcher-sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <mat-icon>flash_on</mat-icon>
      </div>
      <div class="logo-text">
        <span class="brand-name">EnergySuite</span>
        <span class="brand-powered">Enterprise Platform</span>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <div class="nav-indicator"></div>
        <span class="nav-text">Minha Central</span>
      </div>
      
      <!-- List all available modules dynamically -->
      <ng-container *ngFor="let mod of modules">
        <div class="nav-group-title">{{ mod.name }}</div>
        <div class="nav-item" (click)="navigateTo(mod.path)">
          <span class="nav-text">Acessar {{ mod.name }}</span>
        </div>
      </ng-container>
      
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="launcher-main">
    <!-- Topbar -->
    <header class="main-header">
      <div class="header-title">Minha Central</div>
      
      <div class="header-actions">
        <button class="icon-btn"><mat-icon>menu_book</mat-icon></button>
        <button class="icon-btn"><mat-icon>notifications_none</mat-icon></button>
        
        <div class="user-profile" [matMenuTriggerFor]="userMenu">
          <div class="avatar">{{ userInitials }}</div>
        </div>
        
        <mat-menu #userMenu="matMenu">
          <div class="user-details">
            <span class="u-name">{{ userProfile?.firstName || 'Usuário' }}</span>
            <span class="u-email">{{ userProfile?.email }}</span>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>Meu Perfil</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <!-- Apps Content -->
    <div class="content-area">
      <h2 class="section-title">Apps</h2>
      
      <div class="apps-grid">
        <div *ngFor="let mod of modules" class="app-card">
          <div class="card-top-border" [ngClass]="mod.color"></div>
          <div class="card-body">
            <h3 class="app-title">{{ mod.name }}</h3>
            <p class="app-desc">{{ mod.description }}</p>
            <button class="btn-primary" (click)="navigateTo(mod.path)">Acessar</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
