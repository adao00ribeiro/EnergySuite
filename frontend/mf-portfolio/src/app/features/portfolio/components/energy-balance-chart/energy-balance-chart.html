<div class="glass-panel chart-container animate-fade-in">
  <div class="chart-header">
    <h3 class="chart-title">Balanço de Energia Mensal (MWm)</h3>
    <button class="btn-icon" title="Filtrar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    </button>
  </div>
  <div class="chart-wrapper">
    <div echarts [options]="chartOptions" class="echarts-instance"></div>

    <div *ngIf="isLoading()" class="chart-state">
      <mat-icon>hourglass_empty</mat-icon>
      <p>Carregando balanço de energia...</p>
    </div>

    <div *ngIf="isEmpty() && !isLoading()" class="chart-state">
      <mat-icon>account_balance</mat-icon>
      <p>Nenhuma posição disponível para o portfólio no período.</p>
    </div>

    <div *ngIf="hasError() && !isLoading()" class="chart-state error">
      <mat-icon>warning_amber</mat-icon>
      <p>Não foi possível carregar o balanço de energia.</p>
    </div>
  </div>
</div>
