<div class="glass-panel mlops-container animate-slide-up" style="animation-delay: 0.2s">
  <div class="mlops-header">
    <h3 class="mlops-title">MLOps & Pipelines (Airflow)</h3>
    <span class="pulse-indicator"></span>
  </div>
  
  <div class="runs-list">
    <div *ngFor="let run of runs" class="run-item">
      <div class="run-info">
        <h4 class="model-name">{{ run.modelName }}</h4>
        <span class="last-run">{{ run.lastRun }}</span>
      </div>
      
      <div class="run-metrics">
        <span class="accuracy">{{ run.accuracy }}</span>
        <div class="status-badge" [ngClass]="run.status">
          {{ run.status === 'running' ? 'Executando' : (run.status === 'success' ? 'Concluído' : 'Falhou') }}
        </div>
      </div>
    </div>
  </div>
</div>
