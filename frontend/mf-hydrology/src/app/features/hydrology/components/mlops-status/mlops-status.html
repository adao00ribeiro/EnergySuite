<div class="mlops-container">
  <div class="header">
    <h3>Status dos Modelos de ML</h3>
    <span class="live-indicator"></span>
  </div>

  <div class="runs-list">
    <div class="run-item" *ngFor="let run of runs()">
      <div class="run-icon" [ngClass]="run.status">
        <mat-icon *ngIf="run.status === 'completed'">check_circle</mat-icon>
        <mat-icon *ngIf="run.status === 'running'" class="spin-animation">autorenew</mat-icon>
        <mat-icon *ngIf="run.status === 'pending'">schedule</mat-icon>
        <mat-icon *ngIf="run.status === 'failed'">error</mat-icon>
      </div>
      <div class="run-details">
        <div class="model-name">{{ run.modelName }}</div>
        <div class="metrics">
          <span class="accuracy">{{ run.accuracy }}</span>
          <span class="dot">•</span>
          <span class="time">{{ formatDate(run.startedAt) }}</span>
        </div>
      </div>
      <div class="status-badge" [ngClass]="run.status">
        {{ run.status | uppercase }}
      </div>
    </div>
  </div>
</div>
