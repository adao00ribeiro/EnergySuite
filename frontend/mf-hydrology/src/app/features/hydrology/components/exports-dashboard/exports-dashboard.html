<div class="exports-container">
  <div class="header">
    <h3>Arquivos Setoriais (GEVAZP)</h3>
    <p class="subtitle">Faça o download dos relatórios textuais no formato oficial ONS/CCEE gerados pela última simulação.</p>
  </div>

  <table mat-table [dataSource]="exports()" class="mat-elevation-z8 custom-table">
    
    <ng-container matColumnDef="fileType">
      <th mat-header-cell *matHeaderCellDef> Tipo de Deck </th>
      <td mat-cell *matCellDef="let element"> 
        <span class="file-badge">{{element.fileType}}</span> 
      </td>
    </ng-container>

    <ng-container matColumnDef="fileName">
      <th mat-header-cell *matHeaderCellDef> Nome do Arquivo </th>
      <td mat-cell *matCellDef="let element"> {{element.fileName}} </td>
    </ng-container>

    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef> Tamanho </th>
      <td mat-cell *matCellDef="let element"> {{formatBytes(element.sizeBytes)}} </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="text-right"> Download </th>
      <td mat-cell *matCellDef="let element" class="text-right">
        <a [href]="element.downloadUrl" target="_blank" class="download-link">
          <button mat-icon-button color="primary" aria-label="Baixar Arquivo">
            <mat-icon>cloud_download</mat-icon>
          </button>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
