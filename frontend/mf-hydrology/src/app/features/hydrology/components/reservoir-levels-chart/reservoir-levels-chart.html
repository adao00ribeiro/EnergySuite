<div class="chart-container">
  <div class="chart-header">
    <div class="header-titles">
      <h3>Análise de ENA</h3>
      <p class="subtitle">%MLT e MWmed Consolidado</p>
    </div>
    
    <div class="forecast-evolution">
      <span class="evolution-label">Evolução da Previsão:</span>
      <mat-button-toggle-group [(ngModel)]="selectedOffset" (change)="selectedOffset.set($event.value)" aria-label="Evolução da Previsão">
        <mat-button-toggle [value]="0">Hoje</mat-button-toggle>
        <mat-button-toggle [value]="-1">-1 Dia</mat-button-toggle>
        <mat-button-toggle [value]="-2">-2 Dias</mat-button-toggle>
        <mat-button-toggle [value]="-3">-3 Dias</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>

  <div class="echarts-wrapper">
    <div echarts [options]="chartOptions()" class="echarts-instance"></div>

    <div *ngIf="isLoading()" class="chart-state">
      <mat-icon>hourglass_empty</mat-icon>
      <p>Carregando dados de ENA...</p>
    </div>

    <div *ngIf="isEmpty() && !isLoading()" class="chart-state">
      <mat-icon>show_chart</mat-icon>
      <p>Nenhum dado de ENA disponível para o período selecionado.</p>
    </div>

    <div *ngIf="hasError() && !isLoading()" class="chart-state error">
      <mat-icon>warning_amber</mat-icon>
      <p>Não foi possível carregar os dados de ENA. Tente novamente mais tarde.</p>
    </div>
  </div>
</div>
