<div class="dashboard-layout animate-fade-in">
  <header class="dashboard-header">
    <div>
      <h1 class="page-title text-gradient">Pluvia - Prospecção e Hidrologia</h1>
      <p class="page-subtitle">Previsões hidrológicas, ENA e integração com MLOps - {{ currentDate | date:'longDate' }}</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary">Forçar Rodada MLOps</button>
    </div>
  </header>

  <main class="dashboard-content">
    <mat-tab-group animationDuration="200ms" color="accent" class="custom-tabs">
      <mat-tab label="Precipitação">
        <div class="mt-4">
          <app-precipitation-map></app-precipitation-map>
        </div>
      </mat-tab>

      <mat-tab label="Modelos Hidrológicos">
        <div class="tab-content-placeholder">
          <h3>Execução de Modelos</h3>
          <p>Acompanhamento de execuções SMAP e ML via EKS Spot.</p>
          <div class="mt-4">
            <app-mlops-status></app-mlops-status>
          </div>
        </div>
      </mat-tab>

      <mat-tab label="Cenários Customizados">
        <div class="mt-4">
          <app-custom-scenarios></app-custom-scenarios>
        </div>
      </mat-tab>

      <mat-tab label="Análises ENA" *ngIf="auth.hasPermission('CanViewENA')">
        <div class="charts-grid mt-4">
          <app-reservoir-levels-chart></app-reservoir-levels-chart>
        </div>
      </mat-tab>
      
      <mat-tab label="Arquivos Setoriais (GEVAZP)" *ngIf="auth.hasPermission('CanViewENA')">
        <div class="mt-4">
          <app-exports-dashboard></app-exports-dashboard>
        </div>
      </mat-tab>

    </mat-tab-group>
  </main>
</div>
