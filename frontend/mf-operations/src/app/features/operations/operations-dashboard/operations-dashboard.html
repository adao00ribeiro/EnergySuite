<div class="dashboard-layout animate-fade-in">
  <header class="dashboard-header">
    <div class="header-text">
      <h1 class="page-title text-gradient">Backops — ETRM e Operações</h1>
      <p class="page-subtitle">Gestão de Contratos e Faturamento · {{ currentDate | date:'longDate' }}</p>
    </div>
    <div class="header-actions">
      <button class="btn-sync">
        <span class="btn-sync-icon">⟳</span>
        Sincronizar CCEE
      </button>
    </div>
  </header>

  <main class="dashboard-content">
    <!-- KPI Section -->
    <section class="kpi-section">
      <h2 class="section-title">Visão Geral</h2>
      <div class="kpi-grid">
        <div class="kpi-card kpi-card--amber">
          <div class="kpi-card__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </div>
          <div class="kpi-card__content">
            <span class="kpi-label">Boletas Pendentes</span>
            <span class="kpi-value">12</span>
          </div>
          <div class="kpi-card__trend kpi-card__trend--up">+3 esta semana</div>
        </div>

        <div class="kpi-card kpi-card--red">
          <div class="kpi-card__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="kpi-card__content">
            <span class="kpi-label">Operações Inativas</span>
            <span class="kpi-value">3</span>
          </div>
          <div class="kpi-card__trend kpi-card__trend--down">Requer atenção</div>
        </div>

        <div class="kpi-card kpi-card--blue">
          <div class="kpi-card__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="kpi-card__content">
            <span class="kpi-label">Vencendo em 30 dias</span>
            <span class="kpi-value">5</span>
          </div>
          <div class="kpi-card__trend kpi-card__trend--neutral">Próximos 30 dias</div>
        </div>

        <div class="kpi-card kpi-card--green">
          <div class="kpi-card__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="kpi-card__content">
            <span class="kpi-label">Divergências CCEE</span>
            <span class="kpi-value">2</span>
          </div>
          <div class="kpi-card__trend kpi-card__trend--up">-1 vs. mês anterior</div>
        </div>
      </div>
    </section>

    <!-- Quick Actions & Table -->
    <app-quick-action-cards></app-quick-action-cards>
    <app-contracts-table></app-contracts-table>
  </main>
</div>
