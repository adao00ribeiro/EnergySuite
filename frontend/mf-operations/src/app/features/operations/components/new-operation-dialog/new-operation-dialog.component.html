<h2 mat-dialog-title>Nova Operação — {{ data.actionType }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraparte</mat-label>
      <mat-select formControlName="counterparty">
        <mat-option *ngFor="let company of companies()" [value]="company.id">
          {{ company.tradeName }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="type">
        <mat-option value="Purchase">Compra</mat-option>
        <mat-option value="Sale">Venda</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Submercado</mat-label>
      <mat-select formControlName="submarket">
        <mat-option *ngFor="let sm of submarkets" [value]="sm">{{ sm }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Volume (MWmed)</mat-label>
      <input matInput type="number" formControlName="volumeMwMed" min="1">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Preço (R$/MWh)</mat-label>
      <input matInput type="number" formControlName="price" min="0">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data Início</mat-label>
      <input matInput type="date" formControlName="startDate">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data Fim</mat-label>
      <input matInput type="date" formControlName="endDate">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSave()" [disabled]="form.invalid || isSaving">
    Salvar
  </button>
</mat-dialog-actions>
