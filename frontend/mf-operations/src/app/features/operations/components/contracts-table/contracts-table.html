<div class="glass-panel table-container animate-slide-up" style="animation-delay: 0.2s">
  <div class="table-header">
    <h3 class="table-title">Contratos Recentes</h3>
    <div class="table-actions">
      <input type="text" class="search-input" placeholder="Buscar contrato...">
      <button class="btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </button>
    </div>
  </div>
  
  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID Contrato</th>
          <th>Contraparte</th>
          <th>Tipo</th>
          <th class="text-right">Volume (MWm)</th>
          <th class="text-right">Preço (R$/MWh)</th>
          <th class="text-center">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let contract of contracts">
          <td class="font-mono text-accent">{{ contract.id }}</td>
          <td class="font-medium">{{ contract.counterparty }}</td>
          <td>
            <span class="type-badge" [ngClass]="contract.type === 'Compra' ? 'buy' : 'sell'">
              {{ contract.type }}
            </span>
          </td>
          <td class="text-right">{{ contract.volumeMWm | number:'1.1-2' }}</td>
          <td class="text-right">{{ contract.price | currency:'BRL':'symbol':'1.2-2' }}</td>
          <td class="text-center">
            <span class="status-dot" [ngClass]="{'active': contract.status === 'Vigente', 'pending': contract.status === 'Pendente', 'closed': contract.status === 'Encerrado'}"></span>
            {{ contract.status }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
