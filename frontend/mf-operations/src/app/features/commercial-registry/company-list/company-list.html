<div class="dashboard-layout animate-fade-in">
  <header class="dashboard-header">
    <div>
      <h1 class="page-title text-gradient">Cadastro Comercial</h1>
      <p class="page-subtitle">Gestão de Empresas e Contrapartes</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary">
        Novo Registro
      </button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="glass-panel p-0">
      <table mat-table [dataSource]="dataSource()" matSort class="w-full bg-transparent">
        
        <ng-container matColumnDef="cnpj">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> CNPJ </th>
          <td mat-cell *matCellDef="let element"> {{element.cnpj}} </td>
        </ng-container>

        <ng-container matColumnDef="tradeName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome Fantasia </th>
          <td mat-cell *matCellDef="let element" class="font-semibold" style="color: var(--color-text);"> {{element.tradeName}} </td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoria </th>
          <td mat-cell *matCellDef="let element"> 
            <span class="status-badge" [ngClass]="{'status-active': element.category === 'Contraparte'}">
              {{element.category}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef> Localidade </th>
          <td mat-cell *matCellDef="let element"> {{element.city}}/{{element.state}} </td>
        </ng-container>

        <ng-container matColumnDef="cceeCode">
          <th mat-header-cell *matHeaderCellDef> CCEE </th>
          <td mat-cell *matCellDef="let element"> {{element.cceeCode || '-'}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
          <td mat-cell *matCellDef="let element" class="text-right">
            <button mat-icon-button color="primary">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover-row"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons class="bg-transparent"></mat-paginator>
    </div>
  </main>
</div>
