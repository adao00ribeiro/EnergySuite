<div class="dashboard-layout animate-fade-in">
  <header class="dashboard-header">
    <div>
      <h1 class="page-title text-gradient">Portfólios</h1>
      <p class="page-subtitle">Gestão de Portfólios de Energia</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary">
        Novo Portfólio
      </button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="glass-panel p-0">
      <table mat-table [dataSource]="dataSource()" matSort class="w-full bg-transparent">
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
          <td mat-cell *matCellDef="let element" class="font-semibold"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
          <td mat-cell *matCellDef="let element"> {{element.type}} </td>
        </ng-container>

        <ng-container matColumnDef="responsible">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Responsável </th>
          <td mat-cell *matCellDef="let element"> {{element.responsible}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
          <td mat-cell *matCellDef="let element"> 
            <span class="status-badge" [ngClass]="{'status-active': element.status === 'Active', 'status-inactive': element.status === 'Inactive'}">
              {{element.status}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-right"> Ações </th>
          <td mat-cell *matCellDef="let element" class="text-right">
            <button mat-icon-button color="primary">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover-row"></tr>
      </table>
      <div class="empty-table" *ngIf="dataSource().length === 0">
        <mat-icon>folder_open</mat-icon>
        <p>Nenhum portfólio cadastrado no momento.</p>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons class="bg-transparent"></mat-paginator>
    </div>
  </main>
</div>
