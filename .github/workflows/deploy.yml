name: Auto Deploy to Home Lab (Kubernetes)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      app-shell: ${{ steps.filter.outputs.app-shell }}
      mf-hydrology: ${{ steps.filter.outputs.mf-hydrology }}
      mf-operations: ${{ steps.filter.outputs.mf-operations }}
      mf-portfolio: ${{ steps.filter.outputs.mf-portfolio }}
      mf-pricing: ${{ steps.filter.outputs.mf-pricing }}
      etrm-service: ${{ steps.filter.outputs.etrm-service }}
      risk-service: ${{ steps.filter.outputs.risk-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            k8s: 'infra/k8s/**'
            app-shell: 'frontend/app-shell/**'
            mf-hydrology: 'frontend/mf-hydrology/**'
            mf-operations: 'frontend/mf-operations/**'
            mf-portfolio: 'frontend/mf-portfolio/**'
            mf-pricing: 'frontend/mf-pricing/**'
            etrm-service: 'backend/etrm-service/**'
            risk-service: 'backend/risk-service/**'

  deploy:
    needs: detect-changes
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Docker do Minikube
        run: |
          eval $(minikube -p minikube docker-env 2>/dev/null || true)

      - name: 🏗️ Deploy de Manifestos K8s
        run: |
          kubectl apply -k infra/k8s/overlays/prod

      - name: 🚀 Build & Deploy Automatizado
        run: |
          chmod +x infra/deploy-local.sh
          
          # Se foi um disparo manual (workflow_dispatch) ou alteração de infra K8s, compila TODOS os serviços
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.detect-changes.outputs.k8s }}" = "true" ]; then
            echo "🔄 Executando build e deploy de TODOS os serviços no Minikube..."
            ./infra/deploy-local.sh all
          else
            echo "🎯 Executando build seletivo para serviços modificados..."
            [ "${{ needs.detect-changes.outputs.app-shell }}" = "true" ] && ./infra/deploy-local.sh app-shell || true
            [ "${{ needs.detect-changes.outputs.mf-hydrology }}" = "true" ] && ./infra/deploy-local.sh mf-hydrology || true
            [ "${{ needs.detect-changes.outputs.mf-operations }}" = "true" ] && ./infra/deploy-local.sh mf-operations || true
            [ "${{ needs.detect-changes.outputs.mf-portfolio }}" = "true" ] && ./infra/deploy-local.sh mf-portfolio || true
            [ "${{ needs.detect-changes.outputs.mf-pricing }}" = "true" ] && ./infra/deploy-local.sh mf-pricing || true
            [ "${{ needs.detect-changes.outputs.etrm-service }}" = "true" ] && ./infra/deploy-local.sh etrm-service || true
            [ "${{ needs.detect-changes.outputs.risk-service }}" = "true" ] && ./infra/deploy-local.sh risk-service || true
          fi
