name: Auto Deploy to Home Lab (Kubernetes)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🏗️ Deploy da Infraestrutura & Aplicações (K8s via Kustomize)
        run: |
          kubectl apply -k infra/k8s/overlays/prod
          
      - name: "⚙️ Build & Deploy: ETRM Backend (K8s)"
        run: |
          cd backend/etrm-service
          for i in 1 2 3; do docker build --network=host -t energysuite/etrm-service:latest . && break || sleep 10; done
          cd ../../
          kubectl rollout restart deployment etrm-service -n energysuite

      - name: "🎨 Build & Deploy: App Shell (K8s)"
        run: |
          cd frontend/app-shell
          for i in 1 2 3; do docker build --network=host -t energysuite/app-shell:latest . && break || sleep 10; done
          cd ../../
          kubectl rollout restart deployment app-shell -n energysuite

      - name: "🐍 Build & Deploy: Risk Service (K8s)"
        run: |
          cd backend/risk-service
          for i in 1 2 3; do docker build --network=host -t energysuite/risk-service:latest . && break || sleep 10; done
          cd ../../
          kubectl rollout restart deployment risk-service -n energysuite
