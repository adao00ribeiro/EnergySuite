name: GitOps CI/CD Pipeline (k3s + Argo CD)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      app-shell: ${{ steps.filter.outputs.app-shell }}
      mf-hydrology: ${{ steps.filter.outputs.mf-hydrology }}
      mf-operations: ${{ steps.filter.outputs.mf-operations }}
      mf-portfolio: ${{ steps.filter.outputs.mf-portfolio }}
      mf-pricing: ${{ steps.filter.outputs.mf-pricing }}
      etrm-service: ${{ steps.filter.outputs.etrm-service }}
      risk-service: ${{ steps.filter.outputs.risk-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            k8s: 'infra/k8s/**'
            app-shell: 'frontend/app-shell/**'
            mf-hydrology: 'frontend/mf-hydrology/**'
            mf-operations: 'frontend/mf-operations/**'
            mf-portfolio: 'frontend/mf-portfolio/**'
            mf-pricing: 'frontend/mf-pricing/**'
            etrm-service: 'backend/etrm-service/**'
            risk-service: 'backend/risk-service/**'

  build-and-gitops-sync:
    needs: detect-changes
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🏷️ Definir Tag Imutável da Imagem (Commit SHA)
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: 🚀 Build de Imagens com Tags Imutáveis
        run: |
          chmod +x infra/deploy-local.sh
          ./infra/deploy-local.sh all "${IMAGE_TAG}"

      - name: 🔄 Sincronização Declarativa GitOps no k3s (Argo CD)
        run: |
          echo "Argo CD detectará as alterações declarativas em infra/k8s e efetuará a reconciliação automática do cluster k3s."
