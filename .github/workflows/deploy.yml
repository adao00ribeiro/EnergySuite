name: Auto Deploy to Home Lab (Kubernetes)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🏗️ Deploy da Infraestrutura (K8s)
        run: |
          kubectl apply -f k8s/infra/
          
      - name: "⚙️ Build & Deploy: ETRM Backend (K8s)"
        run: |
          cd backend/etrm-service
          docker build --network=host -t energysuite/etrm-service:latest .
          # IMPORTANTE: Se usar K3s ou Minikube, talvez seja necessário carregar a imagem, ex: k3s ctr images import ou minikube image load
          cd ../../
          kubectl apply -f k8s/apps/etrm-service.yaml
          kubectl rollout restart deployment etrm-service

      - name: "🎨 Build & Deploy: App Shell (K8s)"
        run: |
          cd frontend/app-shell
          docker build --network=host -t energysuite/app-shell:latest .
          cd ../../
          kubectl apply -f k8s/apps/app-shell.yaml
          kubectl rollout restart deployment app-shell
